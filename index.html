    /* 左右の三角矢印＋9ボタンエリアを包む外枠 */

  /* 左右のページ切り替え三角形ボタン */
  .page-arrow-btn {
    width: 28px;
    height: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }

  .tri-shape-left {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 14px 14px 14px 0;
    border-color: transparent #e2e8f0 transparent transparent;
    transition: border-color 0.15s;
  }
  .page-arrow-btn.active .tri-shape-left {
    border-color: transparent #e2e8f0 transparent transparent;
  }

  .tri-shape-right {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 14px 0 14px 14px;
    border-color: transparent transparent transparent #3b82f6;
    transition: border-color 0.15s;
  }
  .page-arrow-btn.active .tri-shape-right {
    border-color: transparent transparent transparent #e2e8f0;
  }

  /* 隙間を本物と同じ狭さに詰めた3×3グリッド */
    /* 元画像の画素（縦横比）そのままの大きさで3×3に並べるグリッド */
  .tiles-grid {
    flex: 1;
    align-self: stretch;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 8px 10px;
    padding: 4px 8px;
    place-items: center;
    overflow: hidden;
  }

  .tile-btn {
    border: none;
    background-color: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;

    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile-btn:active { transform: scale(0.98); }

  /* 1ページ目・2ページ目すべてのボタン画像を元画素の比率のまま表示 */

    display: block;

          <input type="number" id="editWeekHours" class="time-input" min="0" max="999" value="0">
          <span>時間</span>

          <span>分</span>
        </div>

      </div>

      <div class="settings-section">
        <div class="settings-section-title">連続学習日数の調整</div>
        <div class="time-edit-row">
          <span class="time-label-fixed">連続日数：</span>

          <button class="settings-btn red" onclick="resetAllData()">全データ初期化</button>

  const CAT_CONFIG = {
    self:   { name: "自分",     color: "#558b2f", defaultTitle: "" },
    sanaru: { name: "さなる",   color: "#0288d1", defaultTitle: "正規コース" },
    school: { name: "学校",     color: "#c0a020", defaultTitle: "" },
    home:   { name: "家庭学習", color: "#d86c88", defaultTitle: "家庭学習" }

  function getScheduleEvents() {
    return JSON.parse(localStorage.getItem('sanaru_schedule_events') || '[]');
  }

  function saveScheduleEventsList(list) {
    localStorage.setItem('sanaru_schedule_events', JSON.stringify(list));
    syncTodayPlansToMain();
  }

  function runBootSequence() {
    const bootScreen = document.getElementById('bootScreen');
    const barFill = document.getElementById('bootBarFill');
    const statusText = document.getElementById('bootStatusText');
    if (!bootScreen) return;

    barFill.style.width = "0%";
    statusText.textContent = "起動準備中・・・0%";

    setTimeout(() => {
      let progress = 0;
      const stepTimer = setInterval(() => {
        progress += Math.floor(Math.random() * 4) + 3;
        if (progress > 100) progress = 100;
        barFill.style.width = progress + "%";

        if (progress < 40) statusText.textContent = "システム初期化中・・・" + progress + "%";
        else if (progress < 90) statusText.textContent = "時間合わせ処理中・・・" + progress + "%";
        else statusText.textContent = "起動準備完了・・・" + progress + "%";

        if (progress >= 100) {
          clearInterval(stepTimer);
          setTimeout(() => { bootScreen.style.display = "none"; }, 180);
        }
      }, 45);
    }, 300);
  }

  function calculateStreak() {
    const manualStreak = localStorage.getItem('sanaru_manual_streak');
    if (manualStreak !== null) return parseInt(manualStreak, 10);
    const studiedKeys = JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]');
    if (studiedKeys.length === 0) return 0;

    const now = new Date();
    const todayKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
    const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    const yesterdayKey = yesterday.getFullYear() + "-" + (yesterday.getMonth() + 1) + "-" + yesterday.getDate();

    let checkDate = null;
    if (studiedKeys.includes(todayKey)) checkDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    else if (studiedKeys.includes(yesterdayKey)) checkDate = yesterday;
    else return 0;

    let count = 0;
    while (true) {
      const k = checkDate.getFullYear() + "-" + (checkDate.getMonth() + 1) + "-" + checkDate.getDate();
      if (studiedKeys.includes(k)) {
        count++;
        checkDate = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate() - 1);
      } else break;
    }
    return count;
  }

  function getMonthMins() {
    const val = localStorage.getItem('sanaru_month_mins');
    return val !== null ? parseInt(val, 10) : parseInt(localStorage.getItem('sanaru_total_mins') || '0', 10);
  }

  function getWeekMins() {
    const val = localStorage.getItem('sanaru_week_mins');
    return val !== null ? parseInt(val, 10) : parseInt(localStorage.getItem('sanaru_total_mins') || '0', 10);
  }

  function buildBackupString() {
    return JSON.stringify({
      month_mins: getMonthMins(),
      week_mins: getWeekMins(),
      studied_keys: JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]'),
      manual_streak: localStorage.getItem('sanaru_manual_streak'),
      schedule_events: getScheduleEvents()
    });
  }

  function openSettingsModal() {
    const mMins = getMonthMins();
    const wMins = getWeekMins();
    document.getElementById('editMonthHours').value = Math.floor(mMins / 60);
    document.getElementById('editMonthMins').value = mMins % 60;
    document.getElementById('editWeekHours').value = Math.floor(wMins / 60);
    document.getElementById('editWeekMins').value = wMins % 60;
    document.getElementById('editStreakDays').value = calculateStreak();
    document.getElementById('backupCodeBox').value = buildBackupString();
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }

  function saveAdjustedTimes() {
    const mh = Math.max(0, parseInt(document.getElementById('editMonthHours').value || '0', 10));
    const mm = Math.max(0, Math.min(59, parseInt(document.getElementById('editMonthMins').value || '0', 10)));
    const wh = Math.max(0, parseInt(document.getElementById('editWeekHours').value || '0', 10));
    const wm = Math.max(0, Math.min(59, parseInt(document.getElementById('editWeekMins').value || '0', 10)));
    localStorage.setItem('sanaru_month_mins', String(mh * 60 + mm));
    localStorage.setItem('sanaru_week_mins', String(wh * 60 + wm));
    renderProfileStats();
    document.getElementById('backupCodeBox').value = buildBackupString();
    alert("今月・今週の学習時間をそれぞれ反映しました。");
  }

  function saveAdjustedStreak() {
    const days = Math.max(0, parseInt(document.getElementById('editStreakDays').value || '0', 10));
    localStorage.setItem('sanaru_manual_streak', String(days));
    renderProfileStats();
    document.getElementById('backupCodeBox').value = buildBackupString();
    alert("連続学習日数を「" + days + "日」に設定しました。");
  }

  function resetStreakToAuto() {
    localStorage.removeItem('sanaru_manual_streak');
    const autoVal = calculateStreak();
    document.getElementById('editStreakDays').value = autoVal;
    renderProfileStats();
    document.getElementById('backupCodeBox').value = buildBackupString();
    alert("自動計算（現在 " + autoVal + "日）に戻しました。");
  }

  function copyBackupCode() {
    const box = document.getElementById('backupCodeBox');
    box.select();
    box.setSelectionRange(0, 99999);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(() => alert("コピーしました。")).catch(() => { document.execCommand('copy'); alert("コピーしました。"); });
    } else { document.execCommand('copy'); alert("コピーしました。"); }
  }

  function restoreBackupCode() {
    const raw = document.getElementById('backupCodeBox').value.trim();
    if (!raw) { alert("復元するバックアップデータを貼り付けてください。"); return; }
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.studied_keys)) {
        localStorage.setItem('sanaru_month_mins', String(parsed.month_mins || 0));
        localStorage.setItem('sanaru_week_mins', String(parsed.week_mins || 0));
        localStorage.setItem('sanaru_studied_keys', JSON.stringify(parsed.studied_keys));
        if (parsed.manual_streak !== null && parsed.manual_streak !== undefined) localStorage.setItem('sanaru_manual_streak', String(parsed.manual_streak));
        else localStorage.removeItem('sanaru_manual_streak');
        if (Array.isArray(parsed.schedule_events)) saveScheduleEventsList(parsed.schedule_events);
        renderProfileStats();
        renderCalendar();
        alert("バックアップから復元しました！");
        closeSettingsModal();
      } else alert("形式が正しくありません。");
    } catch (e) { alert("復元できませんでした。"); }
  }

  function resetAllData() {
    if (confirm("学習時間・スケジュール・カレンダーをすべて初期化しますか？")) {
      localStorage.clear();
      location.reload();
    }
  }
  // ============================================================================
  // ★ 内蔵スケジュール機能（月/週・丸印反映・日付選択・ドラム時間設定）
  // ============================================================================
  let schedYear = new Date().getFullYear();
  let schedMonth = new Date().getMonth() + 1;
  let schedWeekStart = null;
  let schedViewMode = 'month';

  let selCat = 'self';
  let selYear = schedYear;
  let selMonth = schedMonth;
  let selectedDateKeys = [];

  let editingEventId = null;
  let editingTargetDates = [];
  let drumState = { sh: 10, sm: 0, eh: 11, em: 0 };

  function openScheduleScreen() {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    setTimeout(() => {
      loader.style.display = 'none';
      const now = new Date();
      schedYear = now.getFullYear();
      schedMonth = now.getMonth() + 1;
      schedWeekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
      renderScheduleGrid();
      document.getElementById('scheduleScreen').style.display = 'flex';
    }, 500);
  }

  function closeScheduleScreen() {
    document.getElementById('scheduleScreen').style.display = 'none';
    syncTodayPlansToMain();
  }

  function refreshSchedule() {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    renderScheduleGrid();
    setTimeout(() => { loader.style.display = 'none'; }, 500);
  }

  function setSchedView(mode) {
    schedViewMode = mode;
    document.getElementById('btnViewMonth').classList.toggle('active', mode === 'month');
    document.getElementById('btnViewWeek').classList.toggle('active', mode === 'week');
    renderScheduleGrid();
  }

  function moveSchedPeriod(dir) {
    if (schedViewMode === 'month') {
      schedMonth += dir;
      if (schedMonth < 1) { schedMonth = 12; schedYear--; }
      else if (schedMonth > 12) { schedMonth = 1; schedYear++; }
    } else {
      schedWeekStart = new Date(schedWeekStart.getFullYear(), schedWeekStart.getMonth(), schedWeekStart.getDate() + dir * 7);
      schedYear = schedWeekStart.getFullYear();
      schedMonth = schedWeekStart.getMonth() + 1;
    }
    renderScheduleGrid();
  }

    function renderScheduleGrid() {
    const titleEl = document.getElementById('schedYmTitle');
    const tbody = document.getElementById('schedCalBody');
    tbody.innerHTML = '';
    const events = getScheduleEvents();
    const today = getTodayInfo();

    if (schedViewMode === 'month') {
      titleEl.textContent = schedYear + "年" + schedMonth + "月";
      const firstDow = new Date(schedYear, schedMonth - 1, 1).getDay();
      const daysInM = new Date(schedYear, schedMonth, 0).getDate();
      const prevDays = new Date(schedYear, schedMonth - 1, 0).getDate();
      let dCount = 1, nextD = 1;

      for (let r = 0; r < 5; r++) {
        const tr = document.createElement('tr');
        for (let c = 0; c < 7; c++) {
          const td = document.createElement('td');
          const idx = r * 7 + c;
          let cellY = schedYear, cellM = schedMonth, cellD = 1, isOther = false;
          if (idx < firstDow) {
            cellD = prevDays - (firstDow - 1 - idx);
            cellM = schedMonth - 1;
            if (cellM < 1) { cellM = 12; cellY--; }
            isOther = true;
          } else if (dCount <= daysInM) {
            cellD = dCount++;
          } else {
            cellD = nextD++;
            cellM = schedMonth + 1;
            if (cellM > 12) { cellM = 1; cellY++; }
            isOther = true;
          }
          const dKey = cellY + "-" + cellM + "-" + cellD;
          if (isOther) td.classList.add('other-m');
          if (dKey === today.key) td.classList.add('today-highlight');

          const dayEvs = events.filter(ev => ev.date === dKey);
          const homeEv = dayEvs.find(ev => ev.cat === 'home');
          const otherEvs = dayEvs.filter(ev => ev !== homeEv);

          // 1行目：日付の数字 ＋ 家庭学習ピンク帯（横並び）
          const topRow = document.createElement('div');
          topRow.className = 'sched-cell-top';
          const numSpan = document.createElement('span');
          numSpan.className = 'sched-day-num';
          numSpan.textContent = cellD;
          topRow.appendChild(numSpan);

          if (homeEv) {
            const hBar = document.createElement('div');
            hBar.className = 'sched-home-inline';
            const hTime = homeEv.allDay ? homeEv.title : (homeEv.start + "-" + homeEv.end);
            hBar.innerHTML = '<span class="sched-home-dot"></span><span>' + hTime + '</span>';
            hBar.onclick = (e) => { e.stopPropagation(); openEditEventForm(homeEv.id); };
            topRow.appendChild(hBar);
          }
          td.appendChild(topRow);

          // 2行目以降：さなる・自分・学校などの予定帯（時間とタイトルを詰めて表示）
          otherEvs.forEach(ev => {
            const bar = document.createElement('div');
            bar.className = 'sched-ev-bar';
            bar.style.backgroundColor = (CAT_CONFIG[ev.cat] || CAT_CONFIG.self).color;
            const timeStr = ev.allDay ? "" : (ev.start + "-" + ev.end);
            bar.textContent = timeStr + ev.title;
            bar.onclick = (e) => { e.stopPropagation(); openEditEventForm(ev.id); };
            td.appendChild(bar);
          });

          td.onclick = () => {
            selCat = 'self';
            editingEventId = null;
            editingTargetDates = [dKey];

    const tbody = document.getElementById('calBody');
    tbody.innerHTML = '';

    const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
    const prevMonthDays = new Date(viewYear, viewMonth - 1, 0).getDate();
    const studiedKeys = JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]');
    let dayCounter = 1, nextMonthDay = 1;

        const td = document.createElement('td');

          const prevDay = prevMonthDays - (firstDayOfWeek - 1 - cellIndex);
          td.innerHTML = '<span class="day-circle other-month">' + prevDay + '</span>';
        } else if (dayCounter <= daysInMonth) {
          const d = dayCounter;
          const isToday = (viewYear === today.year && viewMonth === today.month && d === today.day);
          const dateKey = viewYear + "-" + viewMonth + "-" + d;
          const isStudied = studiedKeys.includes(dateKey);

          td.innerHTML = '<span class="day-circle other-month">' + nextMonthDay + '</span>';

  let currentCamStream = null;

  async function startCameraStream() {
    if (currentCamStream) {
      currentCamStream.getTracks().forEach(track => track.stop());
      currentCamStream = null;
    }
    const videoEl = document.getElementById('explainCamVideo');
    const facing = useFrontCamera ? 'user' : 'environment';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });
      currentCamStream = stream;
      videoEl.srcObject = stream;
    } catch (err) {
      try {
        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        currentCamStream = fallbackStream;
        videoEl.srcObject = fallbackStream;
      } catch (e) {
        alert("カメラの起動が許可されていないか、カメラが見つかりませんでした。Safariの設定でカメラを許可してください。");

  function playBigTimerBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime + i * 0.25);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.25);
        osc.stop(ctx.currentTime + i * 0.25 + 0.15);
      }
    } catch (e) {}
  }

  function toggleBigTimer() {
    const runBtn = document.getElementById('bigTimerRunBtn');
    const inputEl = document.getElementById('bigTimerMinInput');

    if (bigTimerInterval) {
      clearInterval(bigTimerInterval);
      bigTimerInterval = null;
      runBtn.textContent = "実 行";
      inputEl.disabled = false;
      return;
    }

    if (bigTimerSec <= 0) {
      const mins = parseInt(inputEl.value || '0', 10);
      if (mins <= 0) {
        alert("設定時間（分）を入力してください。");
        return;
      }
      bigTimerSec = mins * 60;
      renderBigTimerDisplay();
    }

    runBtn.textContent = "停 止";
    inputEl.disabled = true;

    bigTimerInterval = setInterval(() => {
      bigTimerSec--;
      if (bigTimerSec <= 0) {
        bigTimerSec = 0;
        renderBigTimerDisplay();
        clearInterval(bigTimerInterval);
        bigTimerInterval = null;
        runBtn.textContent = "実 行";
        inputEl.disabled = false;
        playBigTimerBeep();
        setTimeout(() => alert("設定時間が終了しました！"), 100);
      } else {
        renderBigTimerDisplay();
      }
    }, 1000);
  }

  function closeBigTimer() {
    if (bigTimerInterval) {
      clearInterval(bigTimerInterval);
      bigTimerInterval = null;
    }
    document.getElementById('bigTimerRunBtn').textContent = "実 行";
    document.getElementById('bigTimerMinInput').disabled = false;
    document.getElementById('bigTimerWindow').style.display = 'none';
  }

  (function enableBigTimerScrollbarSlider() {
    const track = document.getElementById('bigTimerScrollTrack');
    const thumb = document.getElementById('bigTimerScrollThumb');
    if (!track || !thumb) return;

    let isSliding = false;

    function calcMinutesFromClientX(clientX) {
      const rect = track.getBoundingClientRect();
      const thumbW = thumb.offsetWidth || 34;
      const maxTravel = Math.max(1, rect.width - thumbW);
      const pos = Math.max(0, Math.min(maxTravel, clientX - rect.left - thumbW / 2));
      return Math.round((pos / maxTravel) * 99);
    }

    track.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (bigTimerInterval) return;
      isSliding = true;
      track.setPointerCapture(e.pointerId);
      setBigTimerMinutes(calcMinutesFromClientX(e.clientX));
    });

    track.addEventListener('pointermove', (e) => {
      if (!isSliding) return;
      e.stopPropagation();
      setBigTimerMinutes(calcMinutesFromClientX(e.clientX));
    });

    const stopSlide = () => { isSliding = false; };
    track.addEventListener('pointerup', stopSlide);
    track.addEventListener('pointercancel', stopSlide);
  })();

  (function enableBigTimerDrag() {
    const win = document.getElementById('bigTimerWindow');
    if (!win) return;

    let isDragging = false;
    let startX = 0, startY = 0;
    let origLeft = 0, origTop = 0;

    win.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.bigtimer-scrollbar')) return;
      isDragging = true;
      const rect = win.getBoundingClientRect();
      origLeft = rect.left;
      origTop = rect.top;
      startX = e.clientX;
      startY = e.clientY;
      win.setPointerCapture(e.pointerId);
    });

    win.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const maxLeft = window.innerWidth - win.offsetWidth;
      const maxTop = window.innerHeight - win.offsetHeight;
      win.style.left = Math.max(0, Math.min(maxLeft, origLeft + dx)) + 'px';
      win.style.top = Math.max(0, Math.min(maxTop, origTop + dy)) + 'px';
    });

    const stopDrag = () => { isDragging = false; };
    win.addEventListener('pointerup', stopDrag);
    win.addEventListener('pointercancel', stopDrag);
  })();
</script>

<script>
  const FILEBOX_URL = "https://github.io";
  const GRADE_ENTRY_URL = "https://atwill-net.com";

  const CAT_CONFIG = {
    self:   { name: "自分",     color: "#558b2f", defaultTitle: "" },
    sanaru: { name: "さなる",   color: "#0288d1", defaultTitle: "正規コース" },
    school: { name: "学校",     color: "#c0a020", defaultTitle: "" },
    home:   { name: "家庭学習", color: "#d86c88", defaultTitle: "家庭学習" }
  };

  function getScheduleEvents() {
    return JSON.parse(localStorage.getItem('sanaru_schedule_events') || '[]');
  }

  function saveScheduleEventsList(list) {
    localStorage.setItem('sanaru_schedule_events', JSON.stringify(list));
    syncTodayPlansToMain();
  }

  function runBootSequence() {
    const bootScreen = document.getElementById('bootScreen');
    const barFill = document.getElementById('bootBarFill');
    const statusText = document.getElementById('bootStatusText');
    if (!bootScreen) return;

    barFill.style.width = "0%";
    statusText.textContent = "起動準備中・・・0%";

    setTimeout(() => {
      let progress = 0;
      const stepTimer = setInterval(() => {
        progress += Math.floor(Math.random() * 4) + 3;
        if (progress > 100) progress = 100;
        barFill.style.width = progress + "%";

        if (progress < 40) statusText.textContent = "システム初期化中・・・" + progress + "%";
        else if (progress < 90) statusText.textContent = "時間合わせ処理中・・・" + progress + "%";
        else statusText.textContent = "起動準備完了・・・" + progress + "%";

        if (progress >= 100) {
          clearInterval(stepTimer);
          setTimeout(() => { bootScreen.style.display = "none"; }, 180);
        }
      }, 45);
    }, 300);
  }

  function calculateStreak() {
    const manualStreak = localStorage.getItem('sanaru_manual_streak');
    if (manualStreak !== null) return parseInt(manualStreak, 10);
    const studiedKeys = JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]');
    if (studiedKeys.length === 0) return 0;

    const now = new Date();
    const todayKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
    const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    const yesterdayKey = yesterday.getFullYear() + "-" + (yesterday.getMonth() + 1) + "-" + yesterday.getDate();

    let checkDate = null;
    if (studiedKeys.includes(todayKey)) checkDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    else if (studiedKeys.includes(yesterdayKey)) checkDate = yesterday;
    else return 0;

    let count = 0;
    while (true) {
      const k = checkDate.getFullYear() + "-" + (checkDate.getMonth() + 1) + "-" + checkDate.getDate();
      if (studiedKeys.includes(k)) {
        count++;
        checkDate = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate() - 1);
      } else break;
    }
    return count;
  }

  function getMonthMins() {
    const val = localStorage.getItem('sanaru_month_mins');
    return val !== null ? parseInt(val, 10) : parseInt(localStorage.getItem('sanaru_total_mins') || '0', 10);
  }

  function getWeekMins() {
    const val = localStorage.getItem('sanaru_week_mins');
    return val !== null ? parseInt(val, 10) : parseInt(localStorage.getItem('sanaru_total_mins') || '0', 10);
  }

  function buildBackupString() {
    return JSON.stringify({
      month_mins: getMonthMins(),
      week_mins: getWeekMins(),
      studied_keys: JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]'),
      manual_streak: localStorage.getItem('sanaru_manual_streak'),
      schedule_events: getScheduleEvents()
    });
  }

  function openSettingsModal() {
    const mMins = getMonthMins();
    const wMins = getWeekMins();
    document.getElementById('editMonthHours').value = Math.floor(mMins / 60);
    document.getElementById('editMonthMins').value = mMins % 60;
    document.getElementById('editWeekHours').value = Math.floor(wMins / 60);
    document.getElementById('editWeekMins').value = wMins % 60;
    document.getElementById('editStreakDays').value = calculateStreak();
    document.getElementById('backupCodeBox').value = buildBackupString();
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }

  function saveAdjustedTimes() {
    const mh = Math.max(0, parseInt(document.getElementById('editMonthHours').value || '0', 10));
    const mm = Math.max(0, Math.min(59, parseInt(document.getElementById('editMonthMins').value || '0', 10)));
    const wh = Math.max(0, parseInt(document.getElementById('editWeekHours').value || '0', 10));
    const wm = Math.max(0, Math.min(59, parseInt(document.getElementById('editWeekMins').value || '0', 10)));
    localStorage.setItem('sanaru_month_mins', String(mh * 60 + mm));
    localStorage.setItem('sanaru_week_mins', String(wh * 60 + wm));
    renderProfileStats();
    document.getElementById('backupCodeBox').value = buildBackupString();
    alert("今月・今週の学習時間をそれぞれ反映しました。");
  }

  function saveAdjustedStreak() {
    const days = Math.max(0, parseInt(document.getElementById('editStreakDays').value || '0', 10));
    localStorage.setItem('sanaru_manual_streak', String(days));
    renderProfileStats();
    document.getElementById('backupCodeBox').value = buildBackupString();
    alert("連続学習日数を「" + days + "日」に設定しました。");
  }

  function resetStreakToAuto() {
    localStorage.removeItem('sanaru_manual_streak');
    const autoVal = calculateStreak();
    document.getElementById('editStreakDays').value = autoVal;
    renderProfileStats();
    document.getElementById('backupCodeBox').value = buildBackupString();
    alert("自動計算（現在 " + autoVal + "日）に戻しました。");
  }

  function copyBackupCode() {
    const box = document.getElementById('backupCodeBox');
    box.select();
    box.setSelectionRange(0, 99999);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(() => alert("コピーしました。")).catch(() => { document.execCommand('copy'); alert("コピーしました。"); });
    } else { document.execCommand('copy'); alert("コピーしました。"); }
  }

  function restoreBackupCode() {
    const raw = document.getElementById('backupCodeBox').value.trim();
    if (!raw) { alert("復元するバックアップデータを貼り付けてください。"); return; }
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.studied_keys)) {
        localStorage.setItem('sanaru_month_mins', String(parsed.month_mins || 0));
        localStorage.setItem('sanaru_week_mins', String(parsed.week_mins || 0));
        localStorage.setItem('sanaru_studied_keys', JSON.stringify(parsed.studied_keys));
        if (parsed.manual_streak !== null && parsed.manual_streak !== undefined) localStorage.setItem('sanaru_manual_streak', String(parsed.manual_streak));
        else localStorage.removeItem('sanaru_manual_streak');
        if (Array.isArray(parsed.schedule_events)) saveScheduleEventsList(parsed.schedule_events);
        renderProfileStats();
        renderCalendar();
        alert("バックアップから復元しました！");
        closeSettingsModal();
      } else alert("形式が正しくありません。");
    } catch (e) { alert("復元できませんでした。"); }
  }

  function resetAllData() {
    if (confirm("学習時間・スケジュール・カレンダーをすべて初期化しますか？")) {
      localStorage.clear();
      location.reload();
    }
  }
  // ============================================================================
  // ★ 内蔵スケジュール機能
  // ============================================================================
  let schedYear = new Date().getFullYear();
  let schedMonth = new Date().getMonth() + 1;
  let schedWeekStart = null;
  let schedViewMode = 'month';

  let selCat = 'self';
  let selYear = schedYear;
  let selMonth = schedMonth;
  let selectedDateKeys = [];

  let editingEventId = null;
  let editingTargetDates = [];
  let drumState = { sh: 10, sm: 0, eh: 11, em: 0 };

  function openScheduleScreen() {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    setTimeout(() => {
      loader.style.display = 'none';
      const now = new Date();
      schedYear = now.getFullYear();
      schedMonth = now.getMonth() + 1;
      schedWeekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
      renderScheduleGrid();
      document.getElementById('scheduleScreen').style.display = 'flex';
    }, 500);
  }

  function closeScheduleScreen() {
    document.getElementById('scheduleScreen').style.display = 'none';
    syncTodayPlansToMain();
  }

  function refreshSchedule() {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    renderScheduleGrid();
    setTimeout(() => { loader.style.display = 'none'; }, 500);
  }

  function setSchedView(mode) {
    schedViewMode = mode;
    document.getElementById('btnViewMonth').classList.toggle('active', mode === 'month');
    document.getElementById('btnViewWeek').classList.toggle('active', mode === 'week');
    renderScheduleGrid();
  }

  function moveSchedPeriod(dir) {
    if (schedViewMode === 'month') {
      schedMonth += dir;
      if (schedMonth < 1) { schedMonth = 12; schedYear--; }
      else if (schedMonth > 12) { schedMonth = 1; schedYear++; }
    } else {
      schedWeekStart = new Date(schedWeekStart.getFullYear(), schedWeekStart.getMonth(), schedWeekStart.getDate() + dir * 7);
      schedYear = schedWeekStart.getFullYear();
      schedMonth = schedWeekStart.getMonth() + 1;
    }
    renderScheduleGrid();
  }

  function renderScheduleGrid() {
    const titleEl = document.getElementById('schedYmTitle');
    const tbody = document.getElementById('schedCalBody');
    tbody.innerHTML = '';
    const events = getScheduleEvents();
    const today = getTodayInfo();

    if (schedViewMode === 'month') {
      titleEl.textContent = schedYear + "年" + schedMonth + "月";
      const firstDow = new Date(schedYear, schedMonth - 1, 1).getDay();
      const daysInM = new Date(schedYear, schedMonth, 0).getDate();
      const prevDays = new Date(schedYear, schedMonth - 1, 0).getDate();
      let dCount = 1, nextD = 1;

      for (let r = 0; r < 5; r++) {
        const tr = document.createElement('tr');
        for (let c = 0; c < 7; c++) {
          const td = document.createElement('td');
          const idx = r * 7 + c;
          let cellY = schedYear, cellM = schedMonth, cellD = 1, isOther = false;
          if (idx < firstDow) {
            cellD = prevDays - (firstDow - 1 - idx);
            cellM = schedMonth - 1;
            if (cellM < 1) { cellM = 12; cellY--; }
            isOther = true;
          } else if (dCount <= daysInM) {
            cellD = dCount++;
          } else {
            cellD = nextD++;
            cellM = schedMonth + 1;
            if (cellM > 12) { cellM = 1; cellY++; }
            isOther = true;
          }
          const dKey = cellY + "-" + cellM + "-" + cellD;
          if (isOther) td.classList.add('other-m');
          if (dKey === today.key) td.classList.add('today-highlight');

          td.innerHTML = '<div class="sched-day-num">' + cellD + '</div>';
          const dayEvs = events.filter(ev => ev.date === dKey);
          dayEvs.forEach(ev => {
            const bar = document.createElement('div');
            bar.className = 'sched-ev-bar';
            bar.style.backgroundColor = (CAT_CONFIG[ev.cat] || CAT_CONFIG.self).color;
            const timeStr = ev.allDay ? "" : (ev.start + "-" + ev.end + " ");
            bar.textContent = timeStr + ev.title;
            bar.onclick = (e) => { e.stopPropagation(); openEditEventForm(ev.id); };
            td.appendChild(bar);
          });
          td.onclick = () => {
            selCat = 'self';
            editingEventId = null;
            editingTargetDates = [dKey];
            openEventFormUI();
          };
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    } else {
      titleEl.textContent = schedYear + "年" + schedMonth + "月（週）";
      const tr = document.createElement('tr');
      for (let c = 0; c < 7; c++) {
        const dObj = new Date(schedWeekStart.getFullYear(), schedWeekStart.getMonth(), schedWeekStart.getDate() + c);
        const dKey = dObj.getFullYear() + "-" + (dObj.getMonth() + 1) + "-" + dObj.getDate();
        const td = document.createElement('td');
        if (dKey === today.key) td.classList.add('today-highlight');
        td.innerHTML = '<div class="sched-day-num">' + (dObj.getMonth() + 1) + '/' + dObj.getDate() + '</div>';
        events.filter(ev => ev.date === dKey).forEach(ev => {
          const bar = document.createElement('div');
          bar.className = 'sched-ev-bar';
          bar.style.backgroundColor = (CAT_CONFIG[ev.cat] || CAT_CONFIG.self).color;
          bar.textContent = (ev.allDay ? "" : (ev.start + "-" + ev.end + " ")) + ev.title;
          bar.onclick = (e) => { e.stopPropagation(); openEditEventForm(ev.id); };
          td.appendChild(bar);
        });
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  function openDateSelect(cat) {
    selCat = cat;
    selYear = schedYear;
    selMonth = schedMonth;
    selectedDateKeys = [];
    const cfg = CAT_CONFIG[cat];
    document.getElementById('dateSelHeader').style.backgroundColor = cfg.color;
    document.getElementById('dateSelSubmitBtn').style.backgroundColor = cfg.color;
    renderDateSelGrid();
    document.getElementById('dateSelectScreen').style.display = 'flex';
  }

  function closeDateSelect() { document.getElementById('dateSelectScreen').style.display = 'none'; }

  function moveDateSelMonth(dir) {
    selMonth += dir;
    if (selMonth < 1) { selMonth = 12; selYear--; }
    else if (selMonth > 12) { selMonth = 1; selYear++; }
    renderDateSelGrid();
  }

  function renderDateSelGrid() {
    document.getElementById('dateSelYmLabel').textContent = selYear + "年" + selMonth + "月";
    const tbody = document.getElementById('dateSelBody');
    tbody.innerHTML = '';
    const firstDow = new Date(selYear, selMonth - 1, 1).getDay();
    const daysInM = new Date(selYear, selMonth, 0).getDate();
    let dCount = 1;

    for (let r = 0; r < 5; r++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < 7; c++) {
        const td = document.createElement('td');
        const idx = r * 7 + c;
        if (idx >= firstDow && dCount <= daysInM) {
          const d = dCount++;
          const dKey = selYear + "-" + selMonth + "-" + d;
          td.textContent = d;
          if (selectedDateKeys.includes(dKey)) td.classList.add('selected-day');
          td.onclick = () => {
            if (selectedDateKeys.includes(dKey)) selectedDateKeys = selectedDateKeys.filter(k => k !== dKey);
            else selectedDateKeys.push(dKey);
            renderDateSelGrid();
          };
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  function proceedToEventForm() {
    if (selectedDateKeys.length === 0) { alert("カレンダーから日付を選択してください。"); return; }
    editingEventId = null;
    editingTargetDates = [...selectedDateKeys];
    closeDateSelect();
    openEventFormUI();
  }

  function openEditEventForm(evId) {
    const ev = getScheduleEvents().find(x => x.id === evId);
    if (!ev) return;
    editingEventId = ev.id;
    selCat = ev.cat;
    editingTargetDates = [ev.date];
    openEventFormUI(ev);
  }
   function openEventFormUI(existingEv) {
    const cfg = CAT_CONFIG[selCat] || CAT_CONFIG.self;
    document.getElementById('evFormHeader').style.backgroundColor = cfg.color;
    document.getElementById('evSaveBtn').style.backgroundColor = cfg.color;
    document.getElementById('evDeleteBtn').style.backgroundColor = cfg.color;
    document.getElementById('evDeleteBtn').style.display = existingEv ? 'inline-block' : 'none';

    if (existingEv) {
      const parts = existingEv.date.split('-');
      const dispDate = parts + "/" + String(parts).padStart(2,'0') + "/" + String(parts).padStart(2,'0');
      document.getElementById('evFormTitleBar').textContent = "予定内容修正 (" + dispDate + ")";
      document.getElementById('evTitleInput').value = existingEv.title;
      document.getElementById('evMemoInput').value = existingEv.memo || "";
      document.getElementById('evAllDayCheck').checked = !!existingEv.allDay;
      document.getElementById('evCountdownCheck').checked = !!existingEv.countdown;
      const sp = (existingEv.start || "10:00").split(':');
      const ep = (existingEv.end || "11:00").split(':');
      drumState = {
        sh: parseInt(sp, 10) || 10,
        sm: parseInt(sp, 10) || 0,
        eh: parseInt(ep, 10) || 11,
        em: parseInt(ep, 10) || 0
      };
    } else {
      document.getElementById('evFormTitleBar').textContent = "予定内容登録（" + cfg.name + "）";
      document.getElementById('evTitleInput').value = cfg.defaultTitle;
      document.getElementById('evMemoInput').value = "";
      document.getElementById('evAllDayCheck').checked = false;
      document.getElementById('evCountdownCheck').checked = true;
      const now = new Date();
      drumState = {
        sh: now.getHours(),
        sm: now.getMinutes(),
        eh: (now.getHours() + 1) % 24,
        em: now.getMinutes()
      };
    }
    updateDrumDisplay();
    toggleAllDayCheck();
    document.getElementById('eventFormScreen').style.display = 'flex';
  }

  function closeEventForm() {
    document.getElementById('eventFormScreen').style.display = 'none';
  }

  function toggleAllDayCheck() {
    const isAll = document.getElementById('evAllDayCheck').checked;
    document.getElementById('clockDrumsWrap').style.opacity = isAll ? "0.35" : "1";
    document.getElementById('clockDrumsWrap').style.pointerEvents = isAll ? "none" : "auto";
  }

  function stepDrum(key, delta) {
    if (key === 'sh' || key === 'eh') drumState[key] = (drumState[key] + delta + 24) % 24;
    else drumState[key] = (drumState[key] + delta + 60) % 60;
    updateDrumDisplay();
  }

  function updateDrumDisplay() {
    document.getElementById('drumSh').textContent = String(drumState.sh).padStart(2, '0');
    document.getElementById('drumSm').textContent = String(drumState.sm).padStart(2, '0');
    document.getElementById('drumEh').textContent = String(drumState.eh).padStart(2, '0');
    document.getElementById('drumEm').textContent = String(drumState.em).padStart(2, '0');
  }

  function saveScheduleEvent() {
    const title = document.getElementById('evTitleInput').value.trim() || (CAT_CONFIG[selCat].name + "の予定");
    const memo = document.getElementById('evMemoInput').value.trim();
    const allDay = document.getElementById('evAllDayCheck').checked;
    const countdown = document.getElementById('evCountdownCheck').checked;
    const startStr = String(drumState.sh).padStart(2,'0') + ":" + String(drumState.sm).padStart(2,'0');
    const endStr = String(drumState.eh).padStart(2,'0') + ":" + String(drumState.em).padStart(2,'0');

    let list = getScheduleEvents();
    if (editingEventId) {
      list = list.map(ev => ev.id === editingEventId ? Object.assign({}, ev, { title, memo, allDay, countdown, start: startStr, end: endStr }) : ev);
    } else {
      editingTargetDates.forEach((dKey, i) => {
        list.push({
          id: "ev_" + Date.now() + "_" + i,
          date: dKey,
          cat: selCat,
          title: title,
          memo: memo,
          allDay: allDay,
          countdown: countdown,
          start: startStr,
          end: endStr
        });
      });
    }
    saveScheduleEventsList(list);
    closeEventForm();
    renderScheduleGrid();
  }

  function deleteScheduleEvent() {
    if (!editingEventId) return;
    if (confirm("この予定を削除しますか？")) {
      const list = getScheduleEvents().filter(ev => ev.id !== editingEventId);
      saveScheduleEventsList(list);
      closeEventForm();
      renderScheduleGrid();
    }
  }

  function syncTodayPlansToMain() {
    const today = getTodayInfo();
    const todayEvs = getScheduleEvents().filter(ev => ev.date === today.key);
    const box = document.getElementById('todayPlansBox');
    const headerNext = document.getElementById('headerNextSchedule');

    if (box) {
      box.innerHTML = '';
      todayEvs.forEach(ev => {
        const div = document.createElement('div');
        div.className = 'today-plan-item';
        const dotColor = (CAT_CONFIG[ev.cat] || CAT_CONFIG.self).color;
        const timeText = ev.allDay ? "終日" : (ev.start + "-" + ev.end);
        div.innerHTML = '<span class="plan-dot" style="background:' + dotColor + ';"></span><span>' + timeText + ' ' + ev.title + '</span>';
        box.appendChild(div);
      });
    }

    const countdownEvs = todayEvs.filter(ev => ev.countdown && !ev.allDay).sort((a,b) => a.start.localeCompare(b.start));
    if (headerNext) {
      headerNext.textContent = countdownEvs.length > 0 ? countdownEvs.start : "予定なし";
    }
  }

  function getTodayInfo() {
    const now = new Date();
    const weekNames = ["日", "月", "火", "水", "木", "金", "土"];
    return {
      year: now.getFullYear(),
      month: now.getMonth() + 1,
      day: now.getDate(),
      week: weekNames[now.getDay()],
      key: now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate()
    };
  }

  function updateHeaderDate() {
    const t = getTodayInfo();
    const badge = document.getElementById('headerDateBadge');
    if (badge) badge.textContent = t.month + "月" + t.day + "日（" + t.week + "）";
  }

  function moveWithLoading(targetUrl) {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    const newTab = window.open('about:blank', '_blank');
    setTimeout(() => {
      loader.style.display = 'none';
      if (newTab) newTab.location.href = targetUrl;
      else window.open(targetUrl, '_blank');
    }, 1000);
  }

  function openFilebox() { moveWithLoading(FILEBOX_URL); }
  function openGradeEntry() { moveWithLoading(GRADE_ENTRY_URL); }

  function runUpdate() {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    updateHeaderDate();
    renderCalendar();
    renderProfileStats();
    syncTodayPlansToMain();
    setTimeout(() => { loader.style.display = 'none'; }, 1000);
  }

  function closeTab() {
    if (confirm("終了しますか？")) {
      window.open('', '_self', '');
      window.close();
      setTimeout(() => {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#1e293b;color:#fff;font-size:18px;font-weight:bold;">終了しました。ブラウザのタブを閉じてください。</div>';
      }, 200);
    }
  }

  const initToday = getTodayInfo();
  let viewYear = initToday.year;
  let viewMonth = initToday.month;

  function renderCalendar() {
    const today = getTodayInfo();
    const label = document.getElementById('calMonthLabel');
    label.textContent = (viewYear === today.year) ? (viewMonth + "月") : (viewYear + "年" + viewMonth + "月");
    const tbody = document.getElementById('calBody');
    tbody.innerHTML = '';
    const firstDayOfWeek = new Date(viewYear, viewMonth - 1, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
    const prevMonthDays = new Date(viewYear, viewMonth - 1, 0).getDate();
    const studiedKeys = JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]');
    let dayCounter = 1, nextMonthDay = 1;

    for (let row = 0; row < 6; row++) {
      const tr = document.createElement('tr');
      for (let col = 0; col < 7; col++) {
        const td = document.createElement('td');
        if (col === 6) td.classList.add('sat-col');
        const cellIndex = row * 7 + col;
        if (cellIndex < firstDayOfWeek) {
          const prevDay = prevMonthDays - (firstDayOfWeek - 1 - cellIndex);
          td.innerHTML = '<span class="day-circle other-month">' + prevDay + '</span>';
        } else if (dayCounter <= daysInMonth) {
          const d = dayCounter;
          const isToday = (viewYear === today.year && viewMonth === today.month && d === today.day);
          const dateKey = viewYear + "-" + viewMonth + "-" + d;
          const isStudied = studiedKeys.includes(dateKey);
          if (isToday) td.classList.add('today-cell');
          const classes = ['day-circle'];
          if (isStudied) classes.push('studied-mark');
          td.innerHTML = '<span class="' + classes.join(' ') + '">' + d + '</span>';
          dayCounter++;
        } else {
          td.innerHTML = '<span class="day-circle other-month">' + nextMonthDay + '</span>';
          nextMonthDay++;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  function changeMonth(offset) {
    viewMonth += offset;
    if (viewMonth < 1) { viewMonth = 12; viewYear--; }
    else if (viewMonth > 12) { viewMonth = 1; viewYear++; }
    renderCalendar();
  }

  function resetToToday() {
    const today = getTodayInfo();
    viewYear = today.year;
    viewMonth = today.month;
    renderCalendar();
  }
  let timerInterval = null;
  function formatMinutesText(totalMins) { return Math.floor(totalMins / 60) + "時間" + (totalMins % 60) + "分"; }
  function formatHourMin(elapsedSec) {
    const totalMins = Math.floor(elapsedSec / 60);
    return Math.floor(totalMins / 60) + ":" + String(totalMins % 60).padStart(2, '0');
  }

  function renderProfileStats() {
    const mMins = getMonthMins();
    const wMins = getWeekMins();
    const streak = calculateStreak();
    const studiedKeys = JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]');
    const slot = document.getElementById('profileSlot');
    if (mMins > 0 || wMins > 0 || streak > 0 || studiedKeys.length > 0) {
      slot.innerHTML = '<div class="stat-row"><div>今月の合計学習時間</div><div class="stat-val">' + formatMinutesText(mMins) + '</div></div>'
                     + '<div class="stat-row"><div>今週の累計学習時間</div><div class="stat-val">' + formatMinutesText(wMins) + '</div></div>'
                     + '<div class="stat-row"><div>連続学習日数</div><div class="stat-val">' + streak + '</div></div>';
    }
  }

  function startTimerLoop(startTimeMs) {
    const btn = document.getElementById('studyStartBtn');
    const display = document.getElementById('timerDisplay');
    const label = document.getElementById('timerLabel');
    btn.textContent = '学習終了';
    btn.classList.add('active');
    label.textContent = '開始から';
    const updateDisplay = () => {
      const elapsedSec = Math.max(0, Math.floor((Date.now() - startTimeMs) / 1000));
      display.textContent = formatHourMin(elapsedSec);
    };
    updateDisplay();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateDisplay, 5000);
  }

  function toggleStudy() {
    const today = getTodayInfo();
    const savedStart = localStorage.getItem('sanaru_study_start');
    if (!savedStart) {
      const now = Date.now();
      localStorage.setItem('sanaru_study_start', String(now));
      localStorage.setItem('sanaru_start_key', today.key);
      startTimerLoop(now);
    } else {
      const startMs = parseInt(savedStart, 10);
      const endMs = Date.now();
      const elapsedSec = Math.max(0, Math.floor((endMs - startMs) / 1000));
      const addedMins = Math.max(1, Math.floor(elapsedSec / 60));

      localStorage.setItem('sanaru_month_mins', String(getMonthMins() + addedMins));
      localStorage.setItem('sanaru_week_mins', String(getWeekMins() + addedMins));

      const startKey = localStorage.getItem('sanaru_start_key') || today.key;
      const endKey = today.key;
      const studiedKeys = JSON.parse(localStorage.getItem('sanaru_studied_keys') || '[]');
      if (!studiedKeys.includes(startKey)) studiedKeys.push(startKey);
      if (!studiedKeys.includes(endKey)) studiedKeys.push(endKey);
      localStorage.setItem('sanaru_studied_keys', JSON.stringify(studiedKeys));
      localStorage.removeItem('sanaru_manual_streak');

      const sDate = new Date(startMs);
      const eDate = new Date(endMs);
      const sTime = String(sDate.getHours()).padStart(2,'0') + ":" + String(sDate.getMinutes()).padStart(2,'0');
      const eTime = String(eDate.getHours()).padStart(2,'0') + ":" + String(eDate.getMinutes()).padStart(2,'0');
      const evList = getScheduleEvents();
      evList.push({ id: "ev_home_" + endMs, date: endKey, cat: "home", title: "家庭学習", memo: "", allDay: false, countdown: false, start: sTime, end: eTime });
      saveScheduleEventsList(evList);

      localStorage.removeItem('sanaru_study_start');
      localStorage.removeItem('sanaru_start_key');
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      const btn = document.getElementById('studyStartBtn');
      btn.textContent = '学習開始';
      btn.classList.remove('active');
      document.getElementById('timerLabel').textContent = 'あと';
      document.getElementById('timerDisplay').textContent = '-:-';
      renderProfileStats();
      renderCalendar();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    runBootSequence();
    updateHeaderDate();
    renderProfileStats();
    renderCalendar();
    syncTodayPlansToMain();
    const savedStart = localStorage.getItem('sanaru_study_start');
    if (savedStart) startTimerLoop(parseInt(savedStart, 10));
  });
</script>
</body>
